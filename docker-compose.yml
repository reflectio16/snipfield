services:
  db:
      image: docker.io/library/postgres:16-alpine
      container_name: snipfield-db
      environment:
        POSTGRES_USER: snipfield
        POSTGRES_PASSWORD: snipfield_dev_password
        POSTGRES_DB: snipfield
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data: